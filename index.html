</style><meta content="default" name="apple-mobile-web-app-status-bar-style"/></head><body><main class="app" id="app"><header class="hero"><div class="hero-photo" id="heroPhoto"></div><div class="hero-actions"><button aria-label="Закріпити фотографію" class="round" id="pinBtn" title="Закріпити фотографію">♧</button><button aria-label="Налаштування" class="round" id="settingsBtn" title="Налаштування">⚙</button></div></header><div class="content"><section><div class="section-head"><h1>Важливе</h1><button aria-label="Додати справу" class="add-small" id="addTask">+</button></div><div class="task-list" id="tasks"></div><button aria-expanded="false" class="done-toggle hidden" id="doneToggle"><span class="chev">⌄</span><span id="doneLabel"></span></button><div class="completed hidden" id="completed"></div></section><section class="inspiration" id="inspiration"><div class="section-head"><h2>Для себе</h2></div><div class="idea"><img alt="Атмосферна фотографія до ідеї" class="idea-image" id="ideaImage"/><div class="idea-text"><div class="idea-title" id="ideaTitle"></div><div class="idea-actions"><button class="linkbtn" id="nextIdea">Інша ідея</button><button class="linkbtn" id="hideIdea">Не сьогодні</button></div></div></div></section></div><nav aria-label="Основна навігація" class="nav"><button class="active" data-page="home"><span class="ico">⌂</span>Головна</button><button data-page="stats"><span class="ico">▥</span>Статистика</button><button aria-label="Додати" class="nav-add" id="quickAdd">+</button><button data-page="wishes"><span class="ico">♡</span>Бажання</button><button data-page="more"><span class="ico">•••</span>Ще</button></nav></main><div class="overlay" id="overlay" role="presentation"><div aria-labelledby="sheetTitle" aria-modal="true" class="sheet" role="dialog"><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div></div><script>
(()=>{'use strict';const KEY='mylife-v3';const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const day=today();const $=id=>document.getElementById(id);const get=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}};let state=get();state.tasks??=[];state.completed??={};state.theme??='auto';state.ideaIndex??=0;state.hideIdea??='';state.pin??=null;let showDone=false;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const photos={spring:['photo-1600607687920-4e2a09cf159d','photo-1600607687939-ce8a6c25118c','photo-1600210492486-724fe5c67fb0'],summer:['photo-1600607687939-ce8a6c25118c','photo-1600210492486-724fe5c67fb0','photo-1600607687920-4e2a09cf159d'],autumn:['photo-1600210492486-724fe5c67fb0','photo-1600607687920-4e2a09cf159d','photo-1600607687939-ce8a6c25118c'],winter:['photo-1600607687920-4e2a09cf159d','photo-1600210492486-724fe5c67fb0','photo-1600607687939-ce8a6c25118c']};const ideas=[{title:'Відкрити для себе новий маршрут прогулянки',photo:'photo-1577083552431-6e5fd01aa342'},{title:'Спробувати незвичну укладку волосся',photo:'photo-1529139574466-a303027c1d8b'},{title:'Знайти невелику виставку поруч',photo:'photo-1577083552431-6e5fd01aa342'},{title:'Зробити кілька красивих кадрів міста',photo:'photo-1486406146926-c627a92ad1ab'},{title:'Обрати нове місце для вечірньої прогулянки',photo:'photo-1519501025264-65ba15a82390'}];const url=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=900&q=82`;function season(){let m=new Date().getMonth();return state.theme!=='auto'?state.theme:m<2||m===11?'winter':m<5?'spring':m<8?'summer':'autumn'}function renderTheme(){let s=season();let pal={spring:['#e9eee5','#5c7965','#d8e3d5'],summer:['#f6e9c9','#b48b34','#e8d39a'],autumn:['#eee3d9','#9b624a','#e8d6c9'],winter:['#e6edf2','#5b819d','#d5e3ed']}[s];['--paper','--accent','--soft'].forEach((v,i)=>document.documentElement.style.setProperty(v,pal[i]));document.querySelector('meta[name=theme-color]').content=pal[0];let index=Math.floor(Date.now()/86400000/4)%photos[s].length;let id=state.pin?.photo||photos[s][index];document.documentElement.style.setProperty('--scene',`url("${url(id)}")`);$('pinBtn').classList.toggle('pinned',!!state.pin);$('pinBtn').textContent=state.pin?'◆':'◇';$('pinBtn').title=state.pin?'Відкріпити фото':'Закріпити фото'}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function allTasks(){return state.tasks.filter(t=>!t.deleted&&(t.repeat==='daily'||t.date===day)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}function done(t){return !!state.completed[day+'|'+t.id]}function row(t){let node=document.createElement('div');node.className='task';node.innerHTML=`<button class="check ${done(t)?'done':''}" aria-label="${done(t)?'Позначити невиконаним':'Позначити виконаним'}">${done(t)?'✓':''}</button><div class="task-main"><div class="task-name">${escapeHTML(t.name)}</div>${t.note?`<div class="task-sub">${escapeHTML(t.note)}</div>`:''}</div><span class="task-time">${escapeHTML(t.time||'')}</span><button class="task-open" aria-label="Редагувати справу">›</button>`;node.querySelector('.check').onclick=()=>{state.completed[day+'|'+t.id]=!done(t);save();renderTasks()};node.querySelector('.task-open').onclick=()=>editTask(t);return node}function renderTasks(){let all=allTasks(),pending=all.filter(t=>!done(t)),finished=all.filter(done);$('tasks').replaceChildren(...pending.map(row));if(!pending.length){let e=document.createElement('div');e.className='empty';e.textContent=all.length?'Усе важливе виконано.':'Тут будуть твої важливі справи.';$('tasks').append(e)}$('doneToggle').classList.toggle('hidden',!finished.length);$('doneLabel').textContent=`Виконано ${finished.length}`;$('doneToggle').setAttribute('aria-expanded',String(showDone));$('completed').classList.toggle('hidden',!showDone||!finished.length);$('completed').replaceChildren(...finished.map(row))}function renderIdea(){let hidden=state.hideIdea===day;$('inspiration').classList.toggle('hidden',hidden);let i=ideas[state.ideaIndex%ideas.length];$('ideaTitle').textContent=i.title;$('ideaImage').src=url(i.photo)}function open(title,body){$('sheetTitle').textContent=title;$('sheetBody').replaceChildren(body);$('overlay').classList.add('open')}function close(){$('overlay').classList.remove('open')}function el(tag,props={},children=[]){let e=document.createElement(tag);Object.assign(e,props);children.forEach(c=>e.append(c));return e}function field(label,type,value=''){let w=el('label',{className:'field'});w.append(el('span',{textContent:label}));let input=el('input',{type,value});w.append(input);return [w,input]}function editTask(task){let isNew=!task;let t=task||{id:String(Date.now()),name:'',note:'',time:'',date:day,repeat:'once'};let form=el('form');let [nameWrap,name]=field('Назва справи','text',t.name);name.required=true;let [noteWrap,note]=field('Додаткова інформація (необов’язково)','text',t.note||'');let [timeWrap,time]=field('Час (необов’язково)','time',t.time||'');let repeatWrap=el('label',{className:'field'});repeatWrap.append(el('span',{textContent:'Повторення'}));let repeat=el('select');[['once','Лише сьогодні'],['daily','Щодня']].forEach(([v,txt])=>repeat.append(el('option',{value:v,textContent:txt,selected:t.repeat===v})));repeatWrap.append(repeat);let actions=el('div',{className:'sheet-actions'});let cancel=el('button',{type:'button',className:'btn',textContent:'Скасувати'});cancel.onclick=close;actions.append(cancel);if(!isNew){let del=el('button',{type:'button',className:'btn',textContent:'Видалити'});del.onclick=()=>{t.deleted=true;save();close();renderTasks()};actions.append(del)}actions.append(el('button',{type:'submit',className:'btn primary',textContent:'Зберегти'}));form.append(nameWrap,noteWrap,timeWrap,repeatWrap,actions);form.onsubmit=e=>{e.preventDefault();if(!name.value.trim())return;Object.assign(t,{name:name.value.trim(),note:note.value.trim(),time:time.value,repeat:repeat.value,date:day});if(isNew)state.tasks.push(t);save();close();renderTasks()};open(isNew?'Нова справа':'Редагувати справу',form)}function settings(){let wrap=el('div');wrap.append(el('p',{textContent:'Сезон оформлення. Автоматично — за поточним місяцем.'}));let choices=el('div',{className:'settings'});[['auto','Автоматично'],['spring','Весна'],['summer','Літо'],['autumn','Осінь'],['winter','Зима']].forEach(([val,label])=>{let b=el('button',{textContent:label,className:state.theme===val?'chosen':''});b.onclick=()=>{state.theme=val;state.pin=null;save();renderTheme();settings()};choices.append(b)});wrap.append(choices,el('p',{textContent:'Атмосферне фото змінюється раз на 4 дні. Натисни ◇ у верхньому куті, щоб закріпити його.'}));let actions=el('div',{className:'sheet-actions'}),b=el('button',{className:'btn primary',textContent:'Готово'});b.onclick=close;actions.append(b);wrap.append(actions);open('Оформлення',wrap)}function info(page){let title={stats:'Статистика',wishes:'Бажання',more:'Ще'}[page];let w=el('div');w.append(el('p',{textContent:'Цей розділ додамо на наступному етапі. Зараз працює головний екран, справи, сезонні теми та зміна фотографій.'}));let b=el('button',{className:'btn primary',textContent:'Повернутися'});b.onclick=close;w.append(b);open(title,w)}$('doneToggle').onclick=()=>{showDone=!showDone;renderTasks()};$('addTask').onclick=()=>editTask();$('quickAdd').onclick=()=>editTask();$('settingsBtn').onclick=settings;$('pinBtn').onclick=()=>{if(state.pin)state.pin=null;else{let s=season(),index=Math.floor(Date.now()/86400000/4)%photos[s].length;state.pin={photo:photos[s][index]}}save();renderTheme()};$('nextIdea').onclick=()=>{state.ideaIndex=(state.ideaIndex+1)%ideas.length;save();renderIdea()};$('hideIdea').onclick=()=>{state.hideIdea=day;save();renderIdea()};document.querySelectorAll('.nav [data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page!=='home')info(b.dataset.page)});$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});renderTheme();renderTasks();renderIdea();})();
