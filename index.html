g:7px 13px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around;background:rgba(250,247,241,.95);backdrop-filter:blur(18px);border-top:1px solid #e6ddd3;z-index:15}.nav button{border:0;background:transparent;color:#62554d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10px;min-width:52px}.nav .ico{font-size:21px;line-height:1}.nav button.active{color:var(--accent)}.nav .nav-add{width:46px;height:46px;min-width:46px;background:var(--accent);color:white;border-radius:50%;font-size:30px;font-weight:300;margin-top:-12px}.overlay{position:fixed;inset:0;background:#17100f85;display:none;align-items:flex-end;justify-content:center;z-index:30}.overlay.open{display:flex}.sheet{background:var(--paper);width:min(100%,450px);border-radius:22px 22px 0 0;padding:24px 25px calc(28px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}.sheet h3{font:400 29px 'Playfair Display',Georgia,serif;margin:0 0 18px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0;font-size:12px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);background:#fffcf7;border-radius:9px;padding:13px;color:var(--ink);font-size:15px}.sheet-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.btn{border:1px solid var(--line);background:transparent;padding:11px 15px;border-radius:9px;color:var(--ink)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.settings{display:flex;flex-wrap:wrap;gap:8px}.settings button{border:1px solid var(--line);border-radius:20px;background:transparent;padding:8px 12px;font-size:12px}.settings button.chosen{background:var(--accent);border-color:var(--accent);color:white}.sheet p{font-size:13px;color:var(--muted);line-height:1.6}.hidden{display:none!important}@media(max-width:360px){.content{padding:0 19px}.section-head h1{font-size:43px}.task{gap:8px}.task-name{font-size:14px}.idea-title{fon </style></head><body><main class="app" id="app"><header class="hero"><div class="hero-photo" id="heroPhoto"></div><div class="hero-actions"><button class="round" id="pinBtn" title="Закріпити фотографію" aria-label="Закріпити фотографію">♧</button><button class="round" id="settingsBtn" title="Налаштування" aria-label="Налаштування">⚙</button></div></header><div class="content"><section><div class="section-head"><h1>Важливе</h1><button class="add-small" id="addTask" aria-label="Додати справу">+</button></div><div id="tasks" class="task-list"></div><button id="doneToggle" class="done-toggle hidden" aria-expanded="false"><span class="chev">⌄</span><span id="doneLabel"></span></button><div id="completed" class="completed hidden"></div></section><section class="inspiration" id="inspiration"><div class="section-head"><h2>Для себе</h2></div><div class="idea"><img class="idea-image" id="ideaImage" alt="Атмосферна фотографія до ідеї"><div class="idea-text"><div class="idea-title" id="ideaTitle"></div><div class="idea-actions"><button class="linkbtn" id="nextIdea">Інша ідея</button><button class="linkbtn" id="hideIdea">Не сьогодні</button></div></div></div></section></div><nav class="nav" aria-label="Основна навігація"><button class="active" data-page="home"><span class="ico">⌂</span>Головна</button><button data-page="stats"><span class="ico">▥</span>Статистика</button><button class="nav-add" id="quickAdd" aria-label="Додати">+</button><button data-page="wishes"><span class="ico">♡</span>Бажання</button><button data-page="more"><span class="ico">•••</span>Ще</button></nav></main><div class="overlay" id="overlay" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div></div><script>
(()=>{'use strict';const KEY='mylife-v3';const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const day=today();const $=id=>document.getElementById(id);const get=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}};let state=get();state.tasks??=[];state.completed??={};state.theme??='auto';state.ideaIndex??=0;state.hideIdea??='';state.pin??=null;let showDone=false;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const photos={spring:['photo-1490750967868-88aa4486c946','photo-1441974231531-c6227db76b6e','photo-1470252649378-9c29740c9fa8'],summer:['photo-1476514525535-07fb3b4ae5f1','photo-1500530855697-b586d89ba3ee','photo-1507525428034-b723cf961d3e'],autumn:['photo-1600210492486-724fe5c67fb0','photo-1518837695005-2083093ee35b','photo-1484154218962-a197022b5858'],winter:['photo-1483664852095-d6cc6870702d','photo-1517299321609-52687d1bc55a','photo-1455156218388-5e61b526818b']};const ideas=[{title:'Відкрити для себе новий маршрут прогулянки',photo:'photo-1476514525535-07fb3b4ae5f1'},{title:'Спробувати незвичну укладку волосся',photo:'photo-1529139574466-a303027c1d8b'},{title:'Знайти невелику виставку поруч',photo:'photo-1577083552431-6e5fd01aa342'},{title:'Зробити кілька красивих кадрів міста',photo:'photo-1486406146926-c627a92ad1ab'},{title:'Обрати нове місце для вечірньої прогулянки',photo:'photo-1519501025264-65ba15a82390'}];const url=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=900&q=82`;function season(){let m=new Date().getMonth();return state.theme!=='auto'?state.theme:m<2||m===11?'winter':m<5?'spring':m<8?'summer':'autumn'}function renderTheme(){let s=season();let pal={spring:['#f4f5ee','#526e58','#e0e8d8'],summer:['#fbf6e8','#b78c2b','#f0e3b8'],autumn:['#f7f3ed','#a65d42','#e9d8ca'],winter:['#f1f6f9','#628aa7','#d7e7f0']}[s];['--paper','--accent','--soft'].forEach((v,i)=>document.documentElement.style.setProperty(v,pal[i]));document.querySelector('meta[name=theme-color]').content=pal[0];let index=Math.floor(Date.now()/86400000/4)%photos[s].length;let id=state.pin?.photo||photos[s][index];$('heroPhoto').style.backgroundImage=`url("${url(id)}")`;$('pinBtn').classList.toggle('pinned',!!state.pin);$('pinBtn').textContent=state.pin?'◆':'◇';$('pinBtn').title=state.pin?'Відкріпити фото':'Закріпити фото'}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function allTasks(){return state.tasks.filter(t=>!t.deleted&&(t.repeat==='daily'||t.date===day)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}function done(t){return !!state.completed[day+'|'+t.id]}function row(t){let node=document.createElement('div');node.className='task';node.innerHTML=`<button class="check ${done(t)?'done':''}" aria-label="${done(t)?'Позначити невиконаним':'Позначити виконаним'}">${done(t)?'✓':''}</button><div class="task-main"><div class="task-name">${escapeHTML(t.name)}</div>${t.note?`<div class="task-sub">${escapeHTML(t.note)}</div>`:''}</div><span class="task-time">${escapeHTML(t.time||'')}</span><button class="task-open" aria-label="Редагувати справу">›</button>`;node.querySelector('.check').onclick=()=>{state.completed[day+'|'+t.id]=!done(t);save();renderTasks()};node.querySelector('.task-open').onclick=()=>editTask(t);return node}function renderTasks(){let all=allTasks(),pending=all.filter(t=>!done(t)),finished=all.filter(done);$('tasks').replaceChildren(...pending.map(row));if(!pending.length){let e=document.createElement('div');e.className='empty';e.textContent=all.length?'Усе важливе виконано.':'Справ поки немає. Додай першу — або налаштуй повторення.';$('tasks').append(e)}$('doneToggle').classList.toggle('hidden',!finished.length);$('doneLabel').textContent=`Виконано ${finished.length}`;$('doneToggle').setAttribute('aria-expanded',String(showDone));$('completed').classList.toggle('hidden',!showDone||!finished.length);$('completed').replaceChildren(...finished.map(row))}function renderIdea(){let hidden=state.hideIdea===day;$('inspiration').classList.toggle('hidden',hidden);let i=ideas[state.ideaIndex%ideas.length];$('ideaTitle').textContent=i.title;$('ideaImage').src=url(i.photo)}function open(title,body){$('sheetTitle').textContent=title;$('sheetBody').replaceChildren(body);$('overlay').classList.add('open')}function close(){$('overlay').classList.remove('open')}function el(tag,props={},children=[]){let e=document.createElement(tag);Object.assign(e,props);children.forEach(c=>e.append(c));return e}function field(label,type,value=''){let w=el('label',{className:'field'});w.append(el('span',{textContent:label}));let input=el('input',{type,value});w.append(input);return [w,input]}function editTask(task){let isNew=!task;let t=task||{id:String(Date.now()),name:'',note:'',time:'',date:day,repeat:'once'};let form=el('form');let [nameWrap,name]=field('Назва справи','text',t.name);name.required=true;let [noteWrap,note]=field('Додаткова інформація (необов’язково)','text',t.note||'');let [timeWrap,time]=field('Час (необов’язково)','time',t.time||'');let repeatWrap=el('label',{className:'field'});repeatWrap.append(el('span',{textContent:'Повторення'}));let repeat=el('select');[['once','Лише сьогодні'],['daily','Щодня']].forEach(([v,txt])=>repeat.append(el('option',{value:v,textContent:txt,selected:t.repeat===v})));repeatWrap.append(repeat);let actions=el('div',{className:'sheet-actions'});let cancel=el('button',{type:'button',className:'btn',textContent:'Скасувати'});cancel.onclick=close;actions.append(cancel);if(!isNew){let del=el('button',{type:'button',className:'btn',textContent:'Видалити'});del.onclick=()=>{t.deleted=true;save();close();renderTasks()};actions.append(del)}actions.append(el('button',{type:'submit',className:'btn primary',textContent:'Зберегти'}));form.append(nameWrap,noteWrap,timeWrap,repeatWrap,actions);form.onsubmit=e=>{e.preventDefault();if(!name.value.trim())return;Object.assign(t,{name:name.value.trim(),note:note.value.trim(),time:time.value,repeat:repeat.value,date:day});if(isNew)state.tasks.push(t);save();close();renderTasks()};open(isNew?'Нова справа':'Редагувати справу',form)}function settings(){let wrap=el('div');wrap.append(el('p',{textContent:'Сезон оформлення. Автоматично — за поточним місяцем.'}));let choices=el('div',{className:'settings'});[['auto','Автоматично'],['spring','Весна'],['summer','Літо'],['autumn','Осінь'],['winter','Зима']].forEach(([val,label])=>{let b=el('button',{textContent:label,className:state.theme===val?'chosen':''});b.onclick=()=>{state.theme=val;state.pin=null;save();renderTheme();settings()};choices.append(b)});wrap.append(choices,el('p',{textContent:'Атмосферне фото змінюється раз на 4 дні. Натисни ◇ у верхньому куті, щоб закріпити його.'}));let actions=el('div',{className:'sheet-actions'}),b=el('button',{className:'btn primary',textContent:'Готово'});b.onclick=close;actions.append(b);wrap.append(actions);open('Оформлення',wrap)}function info(page){let title={stats:'Статистика',wishes:'Бажання',more:'Ще'}[page];let w=el('div');w.append(el('p',{textContent:'Цей розділ додамо на наступному етапі. Зараз працює головний екран, справи, сезонні теми та зміна фотографій.'}));let b=el('button',{className:'btn primary',textContent:'Повернутися'});b.onclick=close;w.append(b);open(title,w)}$('doneToggle').onclick=()=>{showDone=!showDone;renderTasks()};$('addTask').onclick=()=>editTask();$('quickAdd').onclick=()=>editTask();$('settingsBtn').onclick=settings;$('pinBtn').onclick=()=>{if(state.pin)state.pin=null;else{let s=season(),index=Math.floor(Date.now()/86400000/4)%photos[s].length;state.pin={photo:photos[s][index]}}save();renderTheme()};$('nextIdea').onclick=()=>{state.ideaIndex=(state.ideaIndex+1)%ideas.length;save();renderIdea()};$('hideIdea').onclick=()=>{state.hideIdea=day;save();renderIdea()};document.querySelectorAll('.nav [data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page!=='home')info(b.dataset.page)});$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});renderTheme();renderTasks();renderIdea();})();
</script></body></html>
